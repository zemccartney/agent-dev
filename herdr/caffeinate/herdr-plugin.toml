id = "agent-dev.caffeinate"
name = "Caffeinate"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Time-bounded caffeination for local Pi and Claude Code runs"
platforms = ["macos"]

[[startup]]
command = ["/bin/sh", "scripts/launch.sh", "ensure"]

[[actions]]
id = "controls"
title = "Caffeination…"
contexts = ["global", "pane"]
command = ["/bin/sh", "scripts/launch.sh", "controls"]

[[panes]]
id = "controls"
title = "Caffeination"
placement = "popup"
width = "80%"
height = 22
command = ["/bin/sh", "scripts/launch.sh", "popup"]
