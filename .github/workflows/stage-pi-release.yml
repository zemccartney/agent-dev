name: Stage accepted Pi-lence release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnose environment admission or explicitly recover an accepted release
        type: choice
        required: true
        default: check-environment
        options: [check-environment, stage-accepted-release]
      release_pr:
        description: Accepted release PR number (recovery only)
        type: string
      release_commit:
        description: Full original accepted merge SHA (recovery only)
        type: string
      inspected_npm:
        description: I inspected npm and authorize one staging attempt, not publication (recovery only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stage-pi-lence
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose main-only environment (no npm)
    if: github.repository == 'zemccartney/agent-dev' && github.event_name == 'workflow_dispatch' && inputs.mode == 'check-environment'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm-staging
    permissions: {}
    steps:
      - name: Show only deployment identity
        env:
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$RUN_EVENT" = workflow_dispatch
          test "$RUN_REF" = refs/heads/main
          printf 'Event: %s\nRef: %s\nCommit: %s\nWorkflow: %s\nWorkflow commit: %s\n' \
            "$RUN_EVENT" "$RUN_REF" "$RUN_SHA" "$WORKFLOW_REF" "$WORKFLOW_SHA"
          printf 'Main-only environment admitted this diagnostic. Registry authorization was not exercised.\n' >> "$GITHUB_STEP_SUMMARY"

  select:
    name: Select accepted release (read-only)
    if: github.repository == 'zemccartney/agent-dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'stage-accepted-release'))
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # Resolve the exact commit's accepted release PR; never mutate it.
    outputs:
      stage: ${{ steps.select.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.1
          install_args: --locked
          cache: false
          persist_github_token: false
      - name: Require exact release merge or explicit accepted-release recovery
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- node scripts/stage-pi-release.mjs --select

  validate:
    name: Verify accepted release archive
    needs: select
    if: needs.select.outputs.stage == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # Reauthorize the exact release PR; never mutate it.
    outputs:
      digest: ${{ steps.verified.outputs.digest }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.1
          install_args: --locked
          cache: false
          persist_github_token: false
      - name: Fresh frozen developer setup
        run: mise run setup
      - name: Check accepted main tree
        run: mise exec -- node scripts/check-release-tree.mjs
      - name: Authorize accepted release and pack canonical archive
        id: prepared
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- node scripts/stage-pi-release.mjs --prepare "$RUNNER_TEMP/pi-release"
      - name: Full maintained checks with read-only permissions
        run: mise run check
      - name: Test exact archive in the maintained Node24 host
        id: host24
        env:
          ARCHIVE_NAME: ${{ steps.prepared.outputs.filename }}
          ARCHIVE_SHA256: ${{ steps.prepared.outputs.sha256 }}
        run: mise exec -- pnpm --filter @grepco/pi-lence test:host -- --tarball "$RUNNER_TEMP/pi-release/$ARCHIVE_NAME" --sha256 "$ARCHIVE_SHA256"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Capture Node22 before restoring developer tools
        id: node22
        run: printf 'path=%s\n' "$(command -v node)" >> "$GITHUB_OUTPUT"
      - name: Test the same archive in the maintained Node22 host
        id: host22
        env:
          HOST_NODE: ${{ steps.node22.outputs.path }}
          ARCHIVE_NAME: ${{ steps.prepared.outputs.filename }}
          ARCHIVE_SHA256: ${{ steps.prepared.outputs.sha256 }}
        run: |
          mise exec -- sh -c '
            export PATH="$(mise where node)/bin:$PATH"
            exec pnpm --filter @grepco/pi-lence test:host -- --node "$HOST_NODE" --tarball "$RUNNER_TEMP/pi-release/$ARCHIVE_NAME" --sha256 "$ARCHIVE_SHA256"
          '
      - name: Revalidate source and artifact after checks
        id: verified
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RECORD_DIGEST: ${{ steps.prepared.outputs.digest }}
        run: |
          mise exec -- sh -c '
            export PATH="$(mise where node)/bin:$PATH"
            exec node scripts/stage-pi-release.mjs --verify "$RUNNER_TEMP/pi-release"
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: pi-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-release/
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  stage:
    name: Submit verified archive to npm staging only
    needs: validate
    runs-on: macos-15
    timeout-minutes: 15
    # Push/dispatch identity is main; checkout alone cannot change environment admission.
    # Keep this environment main-only, no reviewers/wait timer or administrator bypass.
    environment: npm-staging
    permissions:
      contents: read
      pull-requests: read # Independently reauthorize the same accepted PR before submission.
      id-token: write # npm stage-only trust; no direct publication, approval or dist-tag authority.
    env:
      EXPECTED_RECORD_DIGEST: ${{ needs.validate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.1
          install_args: --locked
          cache: false
          persist_github_token: false
      - name: Fresh frozen developer setup
        run: mise run setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: ${{ runner.temp }}/pi-release/
          digest-mismatch: error
      - name: Reauthorize and submit the exact checked archive
        id: submit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- node scripts/stage-pi-release.mjs --submit "$RUNNER_TEMP/pi-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-stage-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-stage-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
