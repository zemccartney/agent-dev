name: Checks

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full checks (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.1
          install_args: --locked
          cache: false
          persist_github_token: false
      - name: Frozen developer setup
        run: mise run setup
      - name: Keep work-branch scratch out of main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: mise exec -- node scripts/check-release-tree.mjs
      - name: Shared checks
        run: mise run check

  pi-hosts:
    name: Pi host (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS/Node 24 is already exercised by the full check job.
          - os: macos-15
            node: 22.19.0
          - os: ubuntu-24.04
            node: 22.19.0
          - os: ubuntu-24.04
            node: 24.16.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.1
          install_args: --locked
          cache: false
          persist_github_token: false
      - name: Frozen developer setup
        run: mise run setup
      - name: Linux source, tooling, unit tests and isolated SDK smoke
        if: matrix.node == '24.16.0'
        run: mise exec -- pnpm --filter @grepco/pi-lence check:contracts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Capture host runtime before restoring developer tools
        id: host-node
        run: printf 'path=%s\n' "$(command -v node)" >> "$GITHUB_OUTPUT"
      - name: Packed installation and real host modes
        env:
          HOST_NODE: ${{ steps.host-node.outputs.path }}
        run: mise exec -- pnpm --filter @grepco/pi-lence test:host -- --node "$HOST_NODE"
